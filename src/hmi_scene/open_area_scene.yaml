scene_name: open_area
description: >
  Open 20x20 floor scene with one robot and one moving pedestrian.
  There are no walls or elevator assets. The pedestrian collision proxy is the
  only dynamic obstacles for robot planning.

map:
  resolution: 0.05
  origin: [-10.0, -10.0]
  width: 400
  height: 400
  static_inflation_radius: 0.0
  human_inflation_radius: 0.0

models:
  robot:
    name: turtlebot3_burger_ir
    entity_name: turtlebot3_burger_ir
    command_entity_name: turtlebot3_burger_ir
    command_offset: [0.0, 0.0, 0.0]
    pose: [0.0, -9.0, 0.012, 0.0, 0.0, 1.570796]
  human:
    name: pedestrian_1
    entity_name: pedestrian_1
    pose: [0.0, 8.20, 0.474502, 0.0, 0.0, -1.570796]
    linear_speed: 0.32
  walls: []
  map_static_boxes: []
  obstacles:
    - name: pedestrian_1_collision_proxy
      entity_name: pedestrian_1_collision_proxy
      pose: [0.0, 8.20, 0.960000, 0.0, 0.0, -1.570796]
      size: [0.95, 0.60, 1.72]
      is_static: false

pedestrians:
  - name: pedestrian_1
    entity_name: pedestrian_1
    collision_entity_name: pedestrian_1_collision_proxy
    pose: [0.0, 8.20, 0.474502, 0.0, 0.0, -1.570796]
    linear_speed: 0.32
    start_delay_sec: 0.0
    waypoints:
      - [0.0, -9.0]

goal:
  pose: [0.0, 9.0, 0.0, 0.0, 0.0, 1.570796]
