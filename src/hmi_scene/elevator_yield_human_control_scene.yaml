scene_name: elevator_yield_human_control
description: >
  Manual human-control clone of the elevator scene. Geometry, robot start pose,
  walls, elevator assets, and obstacle layout match the original
  elevator_yield scene, but the human is intended to be driven by the Xbox
  set_pose controller instead of the waypoint motion controller.

map:
  resolution: 0.05
  origin: [-5.0, -15.0]
  width: 200
  height: 400
  static_inflation_radius: 0.18
  human_inflation_radius: 0.0

models:
  robot:
    name: starship_delivery_robot_model
    entity_name: starship_delivery_robot_model
    command_entity_name: starship_delivery_robot_model
    command_offset: [0.0, 0.0, 1.570796]
    pose: [0.00, -3.00, 0.012, 0.0, 0.0, 1.570796]
  human:
    name: human_in_elevator
    entity_name: human_in_elevator
    pose: [0.000004, 3.219430, 0.474502, 0.0, 0.0, -1.556373]
    linear_speed: 1.00
  elevator_assets:
    - aws_robomaker_hospital_elevator_01_car
    - aws_robomaker_hospital_elevator_01_portal
  walls:
    - name: left_door_side_wall
      entity_name: left_door_side_wall
      pose: [-1.57, 1.74, 0.0, 0.0, 0.0, 0.0]
      size: [1.50, 0.22, 2.90]
    - name: right_door_side_wall
      entity_name: right_door_side_wall
      pose: [1.57, 1.74, 0.0, 0.0, 0.0, 0.0]
      size: [1.50, 0.22, 2.90]
    - name: left_corridor_wall
      entity_name: left_corridor_wall
      pose: [-2.43, -2.75, 0.0, 0.0, 0.0, 0.0]
      size: [0.22, 9.00, 2.90]
    - name: right_corridor_wall
      entity_name: right_corridor_wall
      pose: [2.43, -2.75, 0.0, 0.0, 0.0, 0.0]
      size: [0.22, 9.00, 2.90]
  map_static_boxes:
    - name: elevator_edge_back
      pose: [0.00, 3.52, 0.0, 0.0, 0.0, 0.0]
      size: [1.60, 0.08, 0.10]
      inflate_radius: 0.05
    - name: elevator_edge_left
      pose: [-0.80, 2.71, 0.0, 0.0, 0.0, 0.0]
      size: [0.08, 1.62, 0.10]
      inflate_radius: 0.05
    - name: elevator_edge_right
      pose: [0.80, 2.71, 0.0, 0.0, 0.0, 0.0]
      size: [0.08, 1.62, 0.10]
      inflate_radius: 0.05
  obstacles:
    - name: human_collision_proxy
      entity_name: human_collision_proxy
      pose: [0.000004, 3.219430, 0.960000, 0.0, 0.0, -1.556373]
      size: [0.95, 0.60, 1.72]
      is_static: false
    - name: rear_obstacle
      entity_name: rear_obstacle
      pose: [1.77, -1.26, 0.0, 0.0, 0.0, 0.0]
      size: [1.10, 0.55, 1.50]
      is_static: true

notes:
  - This clone is intended for Xbox/manual human control.
  - The human position is updated scene-side by the set_pose controller.
