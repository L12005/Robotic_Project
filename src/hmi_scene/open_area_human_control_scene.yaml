scene_name: open_area_human_control
description: >
  Manual human-control clone of the open area scene. The geometry, robot start
  pose, goal, and pedestrian collision proxy match the original open_area
  scene, but the pedestrian is intended to be driven by the Xbox set_pose
  controller instead of the waypoint motion controller.

map:
  resolution: 0.05
  origin: [-10.0, -10.0]
  width: 400
  height: 400
  static_inflation_radius: 0.0
  human_inflation_radius: 0.0

models:
  robot:
    name: starship_delivery_robot_model
    entity_name: starship_delivery_robot_model
    command_entity_name: starship_delivery_robot_model
    command_offset: [0.0, 0.0, 1.570796]
    pose: [0.0, -9.0, 0.012, 0.0, 0.0, 1.570796]
  human:
    name: pedestrian_1
    entity_name: pedestrian_1
    pose: [0.0, 8.20, 0.474502, 0.0, 0.0, -1.570796]
    linear_speed: 1.00
  walls: []
  map_static_boxes: []
  obstacles:
    - name: pedestrian_1_collision_proxy
      entity_name: pedestrian_1_collision_proxy
      pose: [0.0, 8.20, 0.960000, 0.0, 0.0, -1.570796]
      size: [0.95, 0.60, 1.72]
      is_static: false

pedestrians:
  - name: pedestrian_1
    entity_name: pedestrian_1
    collision_entity_name: pedestrian_1_collision_proxy
    pose: [0.0, 8.20, 0.474502, 0.0, 0.0, -1.570796]
    linear_speed: 1.00
    start_delay_sec: 0.0

goal:
  pose: [0.0, 9.0, 0.0, 0.0, 0.0, 1.570796]

notes:
  - This clone is intended for Xbox/manual human control.
  - The pedestrian position is updated scene-side by the set_pose controller.
